# Stock Keyball39 PMW3360, right central, SSD1306 OLED.
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT_PIXART_PMW3360=y
CONFIG_ZMK_EXT_POWER=y
# Poll the stock module at 125 Hz; this driver has no sensor resume callback.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
